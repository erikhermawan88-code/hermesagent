<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Furnicraft CMS · Data Management</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dash26-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <script defer="defer" src="runtime.js"></script><script defer="defer" src="vendor-fullcalendar.js"></script><script defer="defer" src="vendor-chartjs.js"></script><script defer="defer" src="vendors.js"></script><script defer="defer" src="2026.js"></script>
    <style>
      .cms-container { max-width: 1000px; margin: 0 auto; padding: 24px; }
      .cms-section { background: var(--a-card); border: 1px solid var(--a-border); border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
      .cms-header { padding: 20px 24px; border-bottom: 1px solid var(--a-border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
      .cms-header:hover { background: var(--a-hover); }
      .cms-header h3 { margin: 0; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
      .cms-body { padding: 24px; display: none; }
      .cms-body.open { display: block; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .form-group { margin-bottom: 16px; }
      .form-group.full { grid-column: 1 / -1; }
      .form-label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--t-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
      .input, .textarea, .select { width: 100%; padding: 10px 14px; background: var(--a-input-bg); border: 1px solid var(--a-border); border-radius: 8px; color: var(--t-base); font-size: 0.9375rem; font-family: inherit; transition: var(--a-transition); }
      .input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--a-primary); box-shadow: 0 0 0 3px rgba(0,159,117,0.15); }
      .textarea { resize: vertical; min-height: 80px; }
      .btn-save { background: var(--a-primary); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 0.9375rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: var(--a-transition); }
      .btn-save:hover { background: #007a5a; transform: translateY(-1px); }
      .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      .save-status { font-size: 0.875rem; padding: 8px 16px; border-radius: 8px; display: none; align-items: center; gap: 8px; }
      .save-status.success { display: inline-flex; background: rgba(0,159,117,0.15); color: #009F75; }
      .save-status.error { display: inline-flex; background: rgba(220,38,38,0.15); color: #dc2626; }
      .item-list { margin-top: 16px; }
      .item-row { display: flex; gap: 12px; align-items: flex-start; background: var(--a-hover); padding: 12px 16px; border-radius: 10px; margin-bottom: 10px; }
      .item-row input { flex: 1; }
      .item-row .btn-del { background: rgba(220,38,38,0.1); border: none; width: 36px; height: 36px; border-radius: 8px; color: #dc2626; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .item-row .btn-del:hover { background: rgba(220,38,38,0.2); }
      .add-item-btn { background: var(--a-primary-faint); border: 1px dashed var(--a-border); color: var(--a-primary); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; }
      .add-item-btn:hover { background: var(--a-primary-light); }
    </style>
  </head>
  <body data-active="datatable" data-crumbs="CMS | Content Management">
    <div class="shell">
      <div data-shell-sidebar></div>
      <div class="main">
        <div data-shell-topbar></div>
        <main class="content">
          <section class="hero">
            <div class="hero-text">
              <span class="eyebrow">CMS</span>
              <h1 class="hero-title">Content Management</h1>
              <p class="hero-sub">Edit semua konten Furnicraft Indonesia. Perubahan langsung sync ke public website.</p>
            </div>
          </section>

          <div class="cms-container">

            <!-- Info Section -->
            <div class="cms-section" id="section-info">
              <div class="cms-header" onclick="toggleSection('info')">
                <h3>📋 Info Perusahaan</h3>
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;opacity:0.5"><path d="m7 10 5 5 5-5"/></svg>
              </div>
              <div class="cms-body" id="body-info">
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label">Nama Perusahaan</label>
                    <input type="text" class="input" id="info-name" placeholder="Furnicraft Indonesia">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Tagline</label>
                    <input type="text" class="input" id="info-tagline" placeholder="Custom Furniture Berkualitas...">
                  </div>
                  <div class="form-group full">
                    <label class="form-label">Description</label>
                    <textarea class="textarea" id="info-desc" rows="3" placeholder="Deskripsi perusahaan..."></textarea>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Established Year</label>
                    <input type="number" class="input" id="info-established" placeholder="2014">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Experience Text</label>
                    <input type="text" class="input" id="info-experience" placeholder="10+ Tahun">
                  </div>
                </div>
                <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
                  <button class="btn-save" onclick="saveInfo()">💾 Simpan Info</button>
                  <span class="save-status" id="status-info"></span>
                </div>
              </div>
            </div>

            <!-- Contact Section -->
            <div class="cms-section" id="section-contact">
              <div class="cms-header" onclick="toggleSection('contact')">
                <h3>📞 Kontak</h3>
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;opacity:0.5"><path d="m7 10 5 5 5-5"/></svg>
              </div>
              <div class="cms-body" id="body-contact">
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label">Telepon</label>
                    <input type="text" class="input" id="contact-phone" placeholder="+62 812-3456-7890">
                  </div>
                  <div class="form-group">
                    <label class="form-label">WhatsApp (62xxxxxxxxxx)</label>
                    <input type="text" class="input" id="contact-whatsapp" placeholder="6281234567890">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="input" id="contact-email" placeholder="hello@furnicraft.co.id">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Jam Operasional</label>
                    <input type="text" class="input" id="contact-hours" placeholder="Senin - Sabtu: 08.00 - 17.00 WIB">
                  </div>
                  <div class="form-group full">
                    <label class="form-label">Alamat</label>
                    <textarea class="textarea" id="contact-address" rows="2" placeholder="Jl. Industri Raya No. 15..."></textarea>
                  </div>
                </div>
                <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
                  <button class="btn-save" onclick="saveContact()">💾 Simpan Kontak</button>
                  <span class="save-status" id="status-contact"></span>
                </div>
              </div>
            </div>

            <!-- Services Section -->
            <div class="cms-section" id="section-services">
              <div class="cms-header" onclick="toggleSection('services')">
                <h3>🛠️ Layanan</h3>
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;opacity:0.5"><path d="m7 10 5 5 5-5"/></svg>
              </div>
              <div class="cms-body" id="body-services">
                <div id="services-list" class="item-list"></div>
                <button class="add-item-btn" onclick="addService()">+ Tambah Layanan</button>
                <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
                  <button class="btn-save" onclick="saveServices()">💾 Simpan Layanan</button>
                  <span class="save-status" id="status-services"></span>
                </div>
              </div>
            </div>

            <!-- Why Us Section -->
            <div class="cms-section" id="section-why">
              <div class="cms-header" onclick="toggleSection('why')">
                <h3>⭐ Mengapa Memilih Kami</h3>
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;opacity:0.5"><path d="m7 10 5 5 5-5"/></svg>
              </div>
              <div class="cms-body" id="body-why">
                <div id="why-list" class="item-list"></div>
                <button class="add-item-btn" onclick="addWhy()">+ Tambah Item</button>
                <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
                  <button class="btn-save" onclick="saveWhy()">💾 Simpan Mengapa Kami</button>
                  <span class="save-status" id="status-why"></span>
                </div>
              </div>
            </div>

            <!-- Stats Section -->
            <div class="cms-section" id="section-stats">
              <div class="cms-header" onclick="toggleSection('stats')">
                <h3>📊 Statistik</h3>
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;opacity:0.5"><path d="m7 10 5 5 5-5"/></svg>
              </div>
              <div class="cms-body" id="body-stats">
                <div id="stats-list" class="item-list"></div>
                <button class="add-item-btn" onclick="addStat()">+ Tambah Statistik</button>
                <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
                  <button class="btn-save" onclick="saveStats()">💾 Simpan Statistik</button>
                  <span class="save-status" id="status-stats"></span>
                </div>
              </div>
            </div>

            <!-- Testimonials Section -->
            <div class="cms-section" id="section-testimonials">
              <div class="cms-header" onclick="toggleSection('testimonials')">
                <h3>💬 Testimoni</h3>
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;opacity:0.5"><path d="m7 10 5 5 5-5"/></svg>
              </div>
              <div class="cms-body" id="body-testimonials">
                <div id="testimonials-list" class="item-list"></div>
                <button class="add-item-btn" onclick="addTestimonial()">+ Tambah Testimoni</button>
                <div style="margin-top:20px;display:flex;gap:12px;align-items:center">
                  <button class="btn-save" onclick="saveTestimonials()">💾 Simpan Testimoni</button>
                  <span class="save-status" id="status-testimonials"></span>
                </div>
              </div>
            </div>

          </div>
        </main>
        <div data-shell-footer></div>
      </div>
    </div>

    <script>
      const API = '../api/content.php';
      let content = {};

      // Load content
      async function loadContent() {
        try {
          const res = await fetch(API);
          content = await res.json();
          populateForms();
        } catch (e) {
          alert('Gagal load content: ' + e.message);
        }
      }

      // Populate all forms
      function populateForms() {
        // Info
        document.getElementById('info-name').value = content.info?.name || '';
        document.getElementById('info-tagline').value = content.info?.tagline || '';
        document.getElementById('info-desc').value = content.info?.description || '';
        document.getElementById('info-established').value = content.info?.established || '';
        document.getElementById('info-experience').value = content.info?.experience || '';

        // Contact
        document.getElementById('contact-phone').value = content.contact?.phone || '';
        document.getElementById('contact-whatsapp').value = content.contact?.whatsapp || '';
        document.getElementById('contact-email').value = content.contact?.email || '';
        document.getElementById('contact-hours').value = content.contact?.hours || '';
        document.getElementById('contact-address').value = content.contact?.address || '';

        // Services
        renderServices();
        renderWhy();
        renderStats();
        renderTestimonials();
      }

      // Toggle section
      function toggleSection(name) {
        const body = document.getElementById('body-' + name);
        body.classList.toggle('open');
      }

      // ===== SERVICES =====
      function renderServices() {
        const list = document.getElementById('services-list');
        const services = content.services || [];
        list.innerHTML = services.map((s, i) => `
          <div class="item-row">
            <input type="text" class="input" placeholder="Nama layanan" value="${esc(s.name)}" data-key="name" data-idx="${i}">
            <input type="text" class="input" placeholder="Icon (fa-xxx)" value="${esc(s.icon)}" data-key="icon" data-idx="${i}" style="max-width:120px">
            <input type="text" class="input" placeholder="Deskripsi" value="${esc(s.description)}" data-key="desc" data-idx="${i}" style="flex:2">
            <button class="btn-del" onclick="deleteItem('services', ${i})">✕</button>
          </div>
        `).join('');
      }

      function addService() {
        if (!content.services) content.services = [];
        content.services.push({ id: Date.now(), name: '', icon: 'fa-star', description: '' });
        renderServices();
      }

      // ===== WHY US =====
      function renderWhy() {
        const list = document.getElementById('why-list');
        const why = content.why_us || [];
        list.innerHTML = why.map((w, i) => `
          <div class="item-row">
            <input type="text" class="input" placeholder="Judul" value="${esc(w.title)}" data-key="title" data-idx="${i}">
            <input type="text" class="input" placeholder="Value" value="${esc(w.value)}" data-key="value" data-idx="${i}" style="flex:2">
            <button class="btn-del" onclick="deleteItem('why_us', ${i})">✕</button>
          </div>
        `).join('');
      }

      function addWhy() {
        if (!content.why_us) content.why_us = [];
        content.why_us.push({ title: '', value: '' });
        renderWhy();
      }

      // ===== STATS =====
      function renderStats() {
        const list = document.getElementById('stats-list');
        const stats = content.stats || [];
        list.innerHTML = stats.map((s, i) => `
          <div class="item-row">
            <input type="text" class="input" placeholder="Label" value="${esc(s.label)}" data-key="label" data-idx="${i}">
            <input type="text" class="input" placeholder="Value" value="${esc(s.value)}" data-key="value" data-idx="${i}">
            <button class="btn-del" onclick="deleteItem('stats', ${i})">✕</button>
          </div>
        `).join('');
      }

      function addStat() {
        if (!content.stats) content.stats = [];
        content.stats.push({ label: '', value: '' });
        renderStats();
      }

      // ===== TESTIMONIALS =====
      function renderTestimonials() {
        const list = document.getElementById('testimonials-list');
        const t = content.testimonials || [];
        list.innerHTML = t.map((item, i) => `
          <div class="item-row" style="flex-wrap:wrap">
            <input type="text" class="input" placeholder="Nama" value="${esc(item.name)}" data-key="name" data-idx="${i}" style="width:30%">
            <input type="text" class="input" placeholder="Role" value="${esc(item.role)}" data-key="role" data-idx="${i}" style="width:30%">
            <input type="text" class="input" placeholder="Avatar URL" value="${esc(item.avatar)}" data-key="avatar" data-idx="${i}" style="width:35%">
            <button class="btn-del" onclick="deleteItem('testimonials', ${i})" style="margin-top:8px">✕</button>
            <div style="width:100%">
              <textarea class="textarea" data-key="quote" data-idx="${i}" placeholder="Testimoni quote..." style="width:100%;margin-top:8px">${esc(item.quote)}</textarea>
            </div>
          </div>
        `).join('');
      }

      function addTestimonial() {
        if (!content.testimonials) content.testimonials = [];
        content.testimonials.push({ id: Date.now(), name: '', role: '', quote: '', avatar: 'https://randomuser.me/api/portraits/men/1.jpg' });
        renderTestimonials();
      }

      // Delete item
      function deleteItem(section, idx) {
        if (!confirm('Hapus item ini?')) return;
        content[section].splice(idx, 1);
        if (section === 'services') renderServices();
        else if (section === 'why_us') renderWhy();
        else if (section === 'stats') renderStats();
        else if (section === 'testimonials') renderTestimonials();
      }

      // ===== SAVE FUNCTIONS =====
      async function saveInfo() {
        const btn = document.querySelector('[onclick="saveInfo()"]');
        const status = document.getElementById('status-info');
        btn.disabled = true;
        status.className = 'save-status';
        status.textContent = 'Menyimpan...';
        status.style.display = 'inline-flex';

        content.info = {
          name: document.getElementById('info-name').value,
          tagline: document.getElementById('info-tagline').value,
          description: document.getElementById('info-desc').value,
          established: parseInt(document.getElementById('info-established').value) || 2014,
          experience: document.getElementById('info-experience').value
        };

        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
          });
          const result = await res.json();
          if (result.success) {
            status.className = 'save-status success';
            status.textContent = '✓ Tersimpan! Backup: ' + result.backup;
          } else {
            throw new Error(result.error);
          }
        } catch (e) {
          status.className = 'save-status error';
          status.textContent = '✕ Error: ' + e.message;
        }
        btn.disabled = false;
      }

      async function saveContact() {
        const btn = document.querySelector('[onclick="saveContact()"]');
        const status = document.getElementById('status-contact');
        btn.disabled = true;
        status.className = 'save-status';
        status.textContent = 'Menyimpan...';
        status.style.display = 'inline-flex';

        content.contact = {
          phone: document.getElementById('contact-phone').value,
          whatsapp: document.getElementById('contact-whatsapp').value,
          email: document.getElementById('contact-email').value,
          hours: document.getElementById('contact-hours').value,
          address: document.getElementById('contact-address').value
        };

        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
          });
          const result = await res.json();
          if (result.success) {
            status.className = 'save-status success';
            status.textContent = '✓ Tersimpan! Backup: ' + result.backup;
          } else {
            throw new Error(result.error);
          }
        } catch (e) {
          status.className = 'save-status error';
          status.textContent = '✕ Error: ' + e.message;
        }
        btn.disabled = false;
      }

      async function saveServices() {
        const btn = document.querySelector('[onclick="saveServices()"]');
        const status = document.getElementById('status-services');
        btn.disabled = true;
        status.textContent = 'Menyimpan...';
        status.className = 'save-status';
        status.style.display = 'inline-flex';

        // Collect from DOM
        const rows = document.querySelectorAll('#services-list .item-row');
        content.services = [];
        rows.forEach((row, i) => {
          const inputs = row.querySelectorAll('input');
          content.services.push({
            id: i + 1,
            name: inputs[0].value,
            icon: inputs[1].value,
            description: inputs[2].value
          });
        });

        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
          });
          const result = await res.json();
          if (result.success) {
            status.className = 'save-status success';
            status.textContent = '✓ Tersimpan! ' + content.services.length + ' layanan';
          } else {
            throw new Error(result.error);
          }
        } catch (e) {
          status.className = 'save-status error';
          status.textContent = '✕ Error: ' + e.message;
        }
        btn.disabled = false;
      }

      async function saveWhy() {
        const btn = document.querySelector('[onclick="saveWhy()"]');
        const status = document.getElementById('status-why');
        btn.disabled = true;
        status.textContent = 'Menyimpan...';
        status.className = 'save-status';
        status.style.display = 'inline-flex';

        const rows = document.querySelectorAll('#why-list .item-row');
        content.why_us = [];
        rows.forEach(row => {
          const inputs = row.querySelectorAll('input');
          content.why_us.push({ title: inputs[0].value, value: inputs[1].value });
        });

        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
          });
          const result = await res.json();
          status.className = result.success ? 'save-status success' : 'save-status error';
          status.textContent = result.success ? '✓ Tersimpan!' : '✕ ' + result.error;
        } catch (e) {
          status.className = 'save-status error';
          status.textContent = '✕ Error: ' + e.message;
        }
        btn.disabled = false;
      }

      async function saveStats() {
        const btn = document.querySelector('[onclick="saveStats()"]');
        const status = document.getElementById('status-stats');
        btn.disabled = true;
        status.textContent = 'Menyimpan...';
        status.className = 'save-status';
        status.style.display = 'inline-flex';

        const rows = document.querySelectorAll('#stats-list .item-row');
        content.stats = [];
        rows.forEach(row => {
          const inputs = row.querySelectorAll('input');
          content.stats.push({ label: inputs[0].value, value: inputs[1].value });
        });

        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
          });
          const result = await res.json();
          status.className = result.success ? 'save-status success' : 'save-status error';
          status.textContent = result.success ? '✓ Tersimpan!' : '✕ ' + result.error;
        } catch (e) {
          status.className = 'save-status error';
          status.textContent = '✕ Error: ' + e.message;
        }
        btn.disabled = false;
      }

      async function saveTestimonials() {
        const btn = document.querySelector('[onclick="saveTestimonials()"]');
        const status = document.getElementById('status-testimonials');
        btn.disabled = true;
        status.textContent = 'Menyimpan...';
        status.className = 'save-status';
        status.style.display = 'inline-flex';

        const rows = document.querySelectorAll('#testimonials-list .item-row');
        content.testimonials = [];
        rows.forEach((row, i) => {
          const inputs = row.querySelectorAll('input');
          const textarea = row.querySelector('textarea');
          content.testimonials.push({
            id: i + 1,
            name: inputs[0].value,
            role: inputs[1].value,
            avatar: inputs[2].value,
            quote: textarea ? textarea.value : ''
          });
        });

        try {
          const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(content)
          });
          const result = await res.json();
          status.className = result.success ? 'save-status success' : 'save-status error';
          status.textContent = result.success ? '✓ Tersimpan!' : '✕ ' + result.error;
        } catch (e) {
          status.className = 'save-status error';
          status.textContent = '✕ Error: ' + e.message;
        }
        btn.disabled = false;
      }

      // Escape helper
      function esc(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // Init
      loadContent();
    </script>
  </body>
</html>
